name: ci

on:
  push:
    branches: [main, master, "ccr-*", "Rust", "native-ui*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONWARNDEFAULTENCODING: "1"

jobs:
  native-app:
    name: Native app on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libasound2-dev
      - name: toolchain (the version in rust-toolchain.toml)
        working-directory: rust
        run: rustup toolchain install
      - name: cargo test minihou-app
        working-directory: rust
        run: cargo test -p minihou-app
      - name: cargo clippy minihou-app
        working-directory: rust
        run: cargo clippy -p minihou-app --all-targets

  rust:
    name: Rust core on ${{ matrix.os }} (cargo test${{ matrix.full && ', clippy, parity, suite with Rust on' || ', parity' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, full: true}
          - {os: windows-latest, full: false}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: toolchain (the version in rust-toolchain.toml)
        working-directory: rust
        run: rustup toolchain install
      - name: cargo test
        working-directory: rust
        run: cargo test --release
      - name: clippy
        if: matrix.full
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings
      - name: Python build tools
        run: python -m pip install numpy numba maturin
      - name: build the wheel
        working-directory: rust
        run: maturin build --release -m crates/minihou-py/Cargo.toml -o ../rust-wheels
      - name: install the wheel
        run: python -m pip install --no-index --find-links rust-wheels minihou-rs
      - name: parity with the Python engine (numba oracle)
        run: python -W error::EncodingWarning -m unittest tests.test_rust_parity -v
      - name: parity with the Python engine (numpy oracle)
        env:
          MINIHOU_NO_NUMBA: "1"
        run: python -W error::EncodingWarning -m unittest tests.test_rust_parity -v
      - name: the whole test suite with the Rust paths on
        if: matrix.full
        run: python -m pip install usd-core scipy && python -W error::EncodingWarning -m unittest discover -s tests -t .

  engine:
    name: tests (${{ matrix.os }}, py${{ matrix.python }}, ${{ matrix.backend }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11", backend: numpy}
          - {os: ubuntu-latest, python: "3.13", backend: numba, browser: true}
          - {os: windows-latest, python: "3.12", backend: numba, browser: true, physics: true}
          - {os: windows-latest, python: "3.13", backend: numpy}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: python -m pip install numpy usd-core ${{ matrix.backend == 'numba' && 'numba scipy' || '' }}   # usd-core: the USD tests skip without it
      - name: physics backend
        if: matrix.physics
        run: python -m pip install "mujoco==3.15.0"
      - name: headless Chromium for the node editor tests
        if: matrix.browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
      - name: backend
        run: python -c "from minihou import accel; print(accel.status())"
      - name: unit tests (EncodingWarning is an error)
        run: python -W error::EncodingWarning -m unittest discover -s tests -t .

  blender-windows:
    name: Blender ${{ matrix.blender }} on Windows (selftest + benchmark)
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {blender: "5.1.2", series: "5.1"}
          - {blender: "5.2.1", series: "5.2"}
    env:
      BLENDER_VERSION: ${{ matrix.blender }}
      BLENDER_SERIES: ${{ matrix.series }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy numba "mujoco==3.15.0"
      - name: cache Blender
        id: cache
        uses: actions/cache@v4
        with:
          path: blender
          key: blender-windows-${{ env.BLENDER_VERSION }}
      - name: download Blender
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $name = "blender-$env:BLENDER_VERSION-windows-x64"
          $url = "https://download.blender.org/release/Blender$env:BLENDER_SERIES/$name.zip"
          Write-Host "downloading $url"
          Invoke-WebRequest -Uri $url -OutFile blender.zip
          Expand-Archive blender.zip -DestinationPath .
          Rename-Item $name blender
      - name: addon selftest in blender --background (via the launcher, as a user would run it)
        shell: pwsh
        run: python tools/launch_blender.py --blender blender\blender.exe --selftest 2>&1 | Tee-Object selftest.txt; exit $LASTEXITCODE
      - name: 1M-point link benchmark
        shell: pwsh
        run: |
          python tools/launch_blender.py --blender blender\blender.exe --bench -- --points 1000000 --iterations 15 2>&1 | Tee-Object bench_raw.txt
          python tools/launch_blender.py --blender blender\blender.exe --bench -- --mode engine --points 1000000 --iterations 10 2>&1 | Tee-Object bench_engine.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blender-windows-logs-${{ matrix.blender }}
          path: |
            selftest.txt
            bench_*.txt

  blender-windows-gui:
    name: Blender ${{ matrix.blender }} GUI smoke test on Windows (experimental, software OpenGL)
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - {blender: "5.1.2", series: "5.1"}
          - {blender: "5.2.1", series: "5.2"}
    env:
      BLENDER_VERSION: ${{ matrix.blender }}
      BLENDER_SERIES: ${{ matrix.series }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy numba
      - name: cache Blender
        id: cache
        uses: actions/cache@v4
        with:
          path: blender
          key: blender-windows-${{ env.BLENDER_VERSION }}
      - name: download Blender
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $name = "blender-$env:BLENDER_VERSION-windows-x64"
          Invoke-WebRequest -Uri "https://download.blender.org/release/Blender$env:BLENDER_SERIES/$name.zip" -OutFile blender.zip
          Expand-Archive blender.zip -DestinationPath .
          Rename-Item $name blender
      - name: software OpenGL (Mesa llvmpipe) next to blender.exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo pal1000/mesa-dist-win --pattern "*release-msvc.7z" --output mesa.7z
          7z x mesa.7z -omesa | Out-Null
          Copy-Item mesa\x64\*.dll blender\
          Get-ChildItem blender\*.dll | Where-Object { $_.Name -match "opengl32|gallium|glapi" } | ForEach-Object { $_.Name }
      - name: GUI smoke test
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
        run: python tools/launch_blender.py --blender blender\blender.exe --gui-test 2>&1 | Tee-Object gui.txt; exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blender-windows-gui-${{ matrix.blender }}
          path: |
            gui.txt
            gui_test_output/
