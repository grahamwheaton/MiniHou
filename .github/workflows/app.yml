name: app

# Builds the packed MiniHou program (PyInstaller, one folder) on each operating system, smoke-tests it (starts it, fetches the
# editor, the Blender add-on zip and the node list) and keeps the zip as an artifact. Pushing a tag like v0.2.0 also attaches
# the zips to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy pyinstaller
      - run: python tools/build_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: MiniHou-${{ runner.os }}
          path: dist/MiniHou-*.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/MiniHou-*.zip
