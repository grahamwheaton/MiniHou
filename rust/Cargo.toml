[workspace]
resolver = "2"
members = ["crates/minihou-core", "crates/minihou-py", "crates/minihou-view", "crates/minihou-app"]
default-members = ["crates/minihou-core", "crates/minihou-py"]

[workspace.package]
edition = "2021"
publish = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
debug = 1

[profile.test]
debug = 1

# Fast test builds: same optimisation as release, without thin LTO and with incremental
# builds and parallel codegen. The shipped release profile above is unchanged.
[profile.testbuild]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
