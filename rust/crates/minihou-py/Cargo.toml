[package]
name = "minihou-py"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Python bindings (PyO3) for the MiniHou Rust core"

[dependencies]
minihou-core = { version = "0.1.0", path = "../minihou-core" }
numpy = "0.29.0"
pyo3 = { version = "0.29", features = ["extension-module"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }

[lib]
name = "minihou_rs"
crate-type = ["cdylib"]
