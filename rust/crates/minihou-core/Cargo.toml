[package]
name = "minihou-core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "MiniHou geometry core: columnar geometry, a few nodes and kernels, graph JSON evaluation"

[dependencies]
# Published 0.8.0 depends on yanked zip 8.x; this pinned upstream revision uses zip 9.
openusd = { git = "https://github.com/mxpv/openusd", rev = "64bae2609d78565adbc8e8df8c575c7526815a00", features = ["serde"] }
openusd-schemas = { git = "https://github.com/mxpv/openusd", rev = "64bae2609d78565adbc8e8df8c575c7526815a00", features = ["geom"] }
rayon = "1.12.0"
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
sysinfo = "0.32"
