[project]
name = "minihou"
version = "0.1.0"
description = "Mini Houdini: a standalone procedural geometry engine that live-links into Blender"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["minihou*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
