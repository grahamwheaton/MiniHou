[project]
name = "minihou"
version = "0.1.0"
description = "Mini Houdini: a standalone procedural geometry engine that live-links into Blender"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# Optional accelerator: 4-15x faster noise / scatter / copy_to_points on large inputs. Falls back to numpy.
accel = ["numba>=0.60"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["minihou*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
