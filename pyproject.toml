[project]
name = "minihou"
version = "0.1.0"
description = "Mini Houdini: a standalone procedural geometry engine that live-links into Blender"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
desktop = ["pywebview>=6.2.1,<7"]
physics = ["mujoco==3.15.0"]
# Optional accelerators: numba makes noise / scatter / copy_to_points 4-15x faster on large inputs; scipy's KD-tree
# speeds up nearest-point queries (attribute_transfer, ray). Without them the numpy paths give the same results.
accel = ["numba>=0.60", "scipy>=1.11"]
# Only for running the node editor's browser tests (tests/test_editor_e2e.py).
browser-tests = ["playwright>=1.56"]
fonts = ["fonttools>=4.40"]
imaging = ["pillow>=10.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["minihou*"]

[tool.setuptools.package-data]
"minihou" = ["assets/*.ico"]
"minihou.web" = ["static/*"]                 # the node editor is served from the installed package

[project.scripts]
minihou = "minihou.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
